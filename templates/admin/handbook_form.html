{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'New' }} Handbook Section — Admin{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ '✏️ Edit' if item else '+ New' }} Handbook Section</h1>
  <a href="{{ url_for('admin_handbook') }}" class="breadcrumb">← Handbook</a>
</div>

<form method="POST" class="content-form">
  <div class="form-group">
    <label class="form-label">Section Title</label>
    <input type="text" name="title" class="form-input" value="{{ item.title if item else '' }}" required placeholder="e.g. Attendance Policy" />
  </div>

  <div class="form-group">
    <label class="form-label">Content <span class="form-hint">(HTML supported)</span></label>
    <textarea name="content" class="form-textarea" rows="14" required placeholder="Write the section content here...">{{ item.content if item else '' }}</textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn--primary">{{ 'Save changes' if item else 'Add section' }}</button>
    <a href="{{ url_for('admin_handbook') }}" class="btn">Cancel</a>
  </div>
</form>
{% endblock %}
