{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'New' }} Chapter — Admin{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ '✏️ Edit' if item else '+ New' }} Chapter</h1>
  <div class="breadcrumb-trail">
    <a href="{{ url_for('admin_handbook') }}" class="breadcrumb-trail__link">Handbook</a>
    <span class="breadcrumb-trail__sep">›</span>
    <a href="{{ url_for('admin_handbook_chapters', section_id=section.id) }}" class="breadcrumb-trail__link">{{ section.title }}</a>
  </div>
</div>

<form method="POST" class="content-form">
  <div class="form-group">
    <label class="form-label">Chapter Title</label>
    <input type="text" name="title" class="form-input" value="{{ item.title if item else '' }}" required placeholder="e.g. Attendance & Commitment" />
  </div>

  <div class="form-group">
    <label class="form-label">Content <span class="form-hint">(HTML supported)</span></label>
    <textarea name="content" class="form-textarea" rows="16" required placeholder="Write the chapter content here...">{{ item.content if item else '' }}</textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn--primary">{{ 'Save changes' if item else 'Add chapter' }}</button>
    <a href="{{ url_for('admin_handbook_chapters', section_id=section.id) }}" class="btn">Cancel</a>
  </div>
</form>
{% endblock %}
